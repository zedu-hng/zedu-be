name: CodeRabbit review

# Caller: the logic lives in zedu-hng/zedu-ci (coderabbit-review.yml), pinned by commit. This file sets
# the triggers, concurrency and token permissions. Keep the file name.
# Public repos under 10 stars need a manual `@coderabbitai review`; the reusable workflow posts it for
# each PR update so the review runs alongside the other PR jobs.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
        type: number

permissions: {}

concurrency:
  group: coderabbit-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    name: Request CodeRabbit review
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: zedu-hng/zedu-ci/.github/workflows/coderabbit-review.yml@fd4a0a3cf27df7866d8bf4ff5505d2d37e2f170f
    with:
      pr: ${{ github.event.pull_request.number || inputs.pr || 0 }}

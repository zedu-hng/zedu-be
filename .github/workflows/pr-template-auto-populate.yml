name: Auto-Populate PR Description

on:
  pull_request:
    types: [opened]
    branches:
      - dev
      - central-staging

permissions:
  pull-requests: write
  contents: read

jobs:
  populate-description:
    runs-on: ubuntu-latest
    name: Add PR Template to Description

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check and populate PR description
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr_number
            });

            const currentBody = (pr.body || '').trim();

            if (currentBody.length >= 50) {
              console.log('PR already has a description, skipping template population');
              return;
            }

            const template = fs.readFileSync('.github/pull_request_template.md', 'utf8');

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr_number,
              body: template
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: `👋 Hi @${pr.user.login}! I've added the PR template to the description. Please fill it in — the ticket ID is mandatory. Thanks!`
            });

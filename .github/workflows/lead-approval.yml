name: Lead approval

# Caller: the logic lives in zedu-hng/zedu-ci (lead-approval.yml), pinned by commit. Keep the file name:
# other workflows look it up.
# The gate is switched off (`enforce_lead_approval: false`) and automatic runs are disabled, so it no
# longer fires on PRs, reviews or the 5-minute sweep. Dispatch it manually to re-check a PR.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-check
        required: true
      base_ref:
        description: Branch the pull request targets
        required: true

permissions: {}

concurrency:
  group: lead-approval-${{ inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  approval:
    name: Lead approval
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    uses: zedu-hng/zedu-ci/.github/workflows/lead-approval.yml@bd1fc3c1ee1339192e1e73bdc5af3ed9dd46cc8e
    with:
      enforce_lead_approval: false
